{{- if and (not .Values.existingSecret.enabled) (or .Values.env.ANTHROPIC_API_KEY .Values.env.OPENAI_API_KEY) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-agent.fullname" . }}-secret
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.env.ANTHROPIC_API_KEY }}
  ANTHROPIC_API_KEY: {{ .Values.env.ANTHROPIC_API_KEY | quote }}
  {{- end }}
  {{- if .Values.env.OPENAI_API_KEY }}
  OPENAI_API_KEY: {{ .Values.env.OPENAI_API_KEY | quote }}
  {{- end }}
{{- end }}
